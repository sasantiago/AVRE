services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-avre}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-avre}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://avre_app:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-avre}?schema=public
      MIGRATE_DATABASE_URL: postgresql://avre_migrator:${POSTGRES_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-avre}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./infra/keys:/app/infra/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # -----------------------------------------------------------------------
  # reverse-proxy: pendiente. En producción va acá un Traefik/Nginx con
  # TLS 1.3 delante de backend/frontend (ver infra/reverse-proxy/README.md).
  # No se implementa en Fase 0-2 — self-hosted local alcanza sin él.
  # -----------------------------------------------------------------------

volumes:
  postgres_data:
  redis_data:
